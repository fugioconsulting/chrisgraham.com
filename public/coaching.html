<style>
  :root {
    --white: #FFFFFF;
    --black: #000000;
    --purple: #A686C8;
    --lavender: #EDE0F5;
    --slate: #4D5663;
    --line: #DCD0E8;
    --line-dark: #C4AEDC;
    --serif: "EB Garamond", Garamond, Georgia, "Times New Roman", serif;
    --sans: "Open Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    --gutter: clamp(1.25rem, 5vw, 2.5rem);
    --hero-pad: clamp(2.5rem, 6vw, 4.5rem);
    color-scheme: only light;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { overflow-x: hidden; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--white);
    color: var(--black);
    font-family: var(--sans);
    font-size: clamp(1rem, 0.95rem + 0.3vw, 1.125rem);
    line-height: 1.6;
  }
  img, picture { max-width: 100%; height: auto; display: block; }
  h1, h2 { font-family: var(--serif); font-weight: 500; line-height: 1.1; margin: 0; }
  p { margin: 0 0 1em; }
  a {
    color: var(--black);
    text-decoration: underline;
    text-decoration-color: var(--purple);
    text-decoration-thickness: 2px;
    text-underline-offset: 0.18em;
  }
  a:hover { text-decoration-color: var(--black); }
  a:focus-visible { outline: 3px solid var(--black); outline-offset: 3px; }

  .skip { position: absolute; left: -999px; top: 0; background: var(--black); color: var(--white); padding: .6rem 1rem; z-index: 10; text-decoration: none; }
  .skip:focus { left: 1rem; top: 1rem; }

  .wrap { width: 100%; max-width: 900px; margin: 0 auto; padding-left: var(--gutter); padding-right: var(--gutter); }

  .home-link { display: inline-flex; align-items: center; min-height: 44px; font-weight: 700; color: var(--slate); text-decoration: underline; text-decoration-color: var(--purple); }
  .home-link:hover { color: var(--black); }

  /* Header */
  .site-header { border-bottom: 1px solid var(--line); background: var(--white); }
  .site-header .wrap { display: flex; align-items: center; justify-content: space-between; gap: 1rem; min-height: 72px; padding-top: 10px; padding-bottom: 10px; max-width: 1100px; }
  .brand span { font-family: var(--serif); font-size: clamp(1.2rem, 1rem + 1vw, 1.4rem); font-weight: 500; letter-spacing: 0.01em; white-space: nowrap; }
  .home-link .short { display: none; }

  /* Hero */
  .hero { background: var(--lavender); }
  .hero .wrap { padding-top: var(--hero-pad); padding-bottom: var(--hero-pad); }
  .hero h1 { font-size: clamp(2.1rem, 6vw, 3.2rem); letter-spacing: -0.01em; margin-bottom: 0.8rem; text-wrap: balance; }
  .hero p { color: var(--slate); max-width: 36em; margin-bottom: 0; }

  /* Booking */
  .booking { padding-top: clamp(2rem, 5vw, 3rem); padding-bottom: clamp(3rem, 7vw, 4.5rem); }
  .booking-frame {
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
    background: var(--white);
  }
  .booking-frame iframe { display: block; width: 100%; height: 600px; border: 0; }

  /* Footer */
  .site-footer { border-top: 1px solid var(--line); }
  .site-footer .wrap { padding-top: 2rem; padding-bottom: 2rem; max-width: 1100px; }
  .legal { font-size: 0.95rem; color: var(--slate); margin: 0; }

  @media (max-width: 359px) {
    .home-link .long { display: none; }
    .home-link .short { display: inline; }
  }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<header class="site-header">
  <div class="wrap">
    <div class="brand">
      <span>Chris Graham</span>
    </div>
    <a class="home-link" href="https://www.chrisgraham.com/"><span aria-hidden="true">&larr;</span>&nbsp;<span class="long">Chris Graham</span><span class="short">Home</span></a>
  </div>
</header>

<main id="main">
  <section class="hero" aria-labelledby="hero-title">
    <div class="wrap">
      <h1 id="hero-title">Book a coaching call.</h1>
      <p>Pick a time below and it's on my calendar. Short is fine &mdash; tell me what you're working on and we'll go from there.</p>
    </div>
  </section>

  <section class="booking" aria-label="Scheduling">
    <div class="wrap">
      <!-- Google Calendar Appointment Scheduling begin -->
      <div class="booking-frame">
        <iframe src="https://calendar.google.com/calendar/appointments/schedules/AcZssZ1-VGVWWYNfrSQrDKYHftvYSVGdpfXllBoDmyraeJPamM7YJJi-oJP6w_nvDw68OPglKfl-gIrf?gv=true" style="border: 0" width="100%" height="600" frameborder="0"></iframe>
      </div>
      <!-- end Google Calendar Appointment Scheduling -->
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap">
    <p class="legal">&copy; 2026 Chris Graham. All Rights Reserved.</p>
  </div>
</footer>

</body>
</html>
